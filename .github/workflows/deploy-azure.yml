name: Build and Push Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ACR Login
        run: echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_NAME }}.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build and Push API
        run: |
          ACR=${{ secrets.ACR_NAME }}.azurecr.io
          TAG=${{ github.sha }}
          docker build -t $ACR/cspoint-api:$TAG ./cspoint-api
          docker push $ACR/cspoint-api:$TAG

      - name: Build and Push Frontend
        run: |
          ACR=${{ secrets.ACR_NAME }}.azurecr.io
          TAG=${{ github.sha }}
          docker build -t $ACR/cspoint-web:$TAG ./cspoint-frontend
          docker push $ACR/cspoint-web:$TAG

      - name: Output deploy commands
        run: |
          echo "Run these after images push:"
          echo "az containerapp update --name <api-app> --resource-group <rg> --image ${{ secrets.ACR_NAME }}.azurecr.io/cspoint-api:${{ github.sha }}"
          echo "az containerapp update --name <web-app> --resource-group <rg> --image ${{ secrets.ACR_NAME }}.azurecr.io/cspoint-web:${{ github.sha }}"
